name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          apogee atmosphere 0 11km 30000ft
          apogee rocket examples/rocket.yaml
          apogee motor examples/motors/Cesaroni_M1670.eng
          apogee aero examples/rocket.yaml --mach 0.3 0.9
          apogee simulate examples/kestrel-airbrakes.yaml --dt 0.02 -o none
          apogee airbrakes --runs 2 --workers 1 --dt 0.05 -o none
          apogee simulate examples/rocket.yaml --wind 4 --dt 0.02 -o flight.csv
          test "$(wc -l < flight.csv)" -gt 1000
          apogee simulate --dt 0.05 -o none --json flight.json
          python -c "import json; assert json.load(open('flight.json'))['format'] == 'apogee-flight'"
          apogee dispersion --wind 4 --runs 8 --dt 0.05 -o dispersion.csv
          test "$(wc -l < dispersion.csv)" -eq 9
