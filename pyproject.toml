[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apogee"
version = "0.1.0"
description = "A 6-DOF rocket flight simulator you can read, validated against RocketPy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haneet Singh" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]
keywords = ["rocketry", "flight-simulation", "6dof", "aerospace", "monte-carlo", "thrust-curve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
apogee = "apogee.cli:main"

[project.urls]
Repository = "https://github.com/Haneet10/Apogee"

[tool.hatch.build.targets.wheel]
packages = ["src/apogee"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "apogee/examples"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = ["D105", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "SIM300"]

[tool.mypy]
strict = true
files = ["src"]
